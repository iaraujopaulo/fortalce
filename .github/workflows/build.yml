name: Construir instaladores FortalCE
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: ubuntu-22.04, args: '' }
          - { os: macos-latest, args: '--target aarch64-apple-darwin' }
          - { os: macos-latest, args: '--target x86_64-apple-darwin' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npx tauri icon app-icon.svg
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.0
          releaseName: FortalCE v0.1.0
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    needs: desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: |
          NDK=27.0.12077973
          for i in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/$NDK"
            if sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK"; then break; fi
            echo "Tentativa $i falhou, tentando de novo..."; sleep 15
          done
          test -d "$ANDROID_HOME/ndk/$NDK" || { echo "NDK nao foi instalado"; exit 1; }
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK" >> $GITHUB_ENV
      - run: npm install
      - run: npx tauri icon app-icon.svg
      - run: npx tauri android init
      - run: npx tauri android build --apk --debug --target aarch64
      - name: Preparar APK
        run: |
          APK=$(find src-tauri/gen/android -name '*.apk' | head -n 1)
          cp "$APK" FortalCE_0.1.0_android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FortalCE-android-apk
          path: FortalCE_0.1.0_android.apk
      - name: Anexar APK a release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ID=$(gh api "repos/$REPO/releases" --jq '.[] | select(.tag_name=="v0.1.0") | .id' | head -n 1)
          if [ -z "$ID" ]; then echo "Release v0.1.0 nao encontrada"; exit 1; fi
          OLD=$(gh api "repos/$REPO/releases/$ID/assets" --jq '.[] | select(.name=="FortalCE_0.1.0_android.apk") | .id')
          if [ -n "$OLD" ]; then gh api --method DELETE "repos/$REPO/releases/assets/$OLD"; fi
          gh api --method POST -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=FortalCE_0.1.0_android.apk" \
            --input FortalCE_0.1.0_android.apk
